<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1Grid Live Prediction</title>
    <meta name="description" content="Leakage-free, walk-forward Formula 1 prediction engine. Predictions published before each race and graded after." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts without blocking render: preload the stylesheet, then swap it in
         on load (font-display:swap in the URL avoids invisible text). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      />
    </noscript>
    <!-- Critical inline CSS so the dark theme and the above-the-fold hero paint
         immediately, before the JS bundle downloads (fast FCP/LCP on mobile). -->
    <style>
      html,body{margin:0;background:#05070a;color:#eef1f5;
        font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;}
      .pre-hero{max-width:1180px;margin:0 auto;padding:40px 24px 0;}
      .pre-eyebrow{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.7rem;
        letter-spacing:.18em;text-transform:uppercase;color:#ff3b30;}
      .pre-title{font-family:"Bebas Neue","Arial Narrow",sans-serif;
        font-size:clamp(2.8rem,1.8rem + 6vw,6rem);line-height:.98;text-transform:uppercase;
        margin:6px 0 0;color:#eef1f5;}
      .pre-sub{color:#7c8794;max-width:520px;margin-top:10px;font-size:.95rem;}
    </style>
  </head>
  <body>
    <!-- Static above-the-fold shell: React replaces #root on mount. This gives an
         instant first paint; the real interactive app hydrates right after. -->
    <div id="root">
      <div class="pre-hero">
        <div class="pre-eyebrow">F1GRID / LIVE PREDICTION ENGINE</div>
        <h1 class="pre-title">Race weekend,<br />predicted.</h1>
        <p class="pre-sub">A leakage-free, walk-forward Formula 1 forecast. Every
          prediction is published before the race and graded against the real result
          afterward.</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
