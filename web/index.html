<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1Grid Live Prediction</title>
    <meta name="description" content="Leakage-free, walk-forward Formula 1 prediction engine. Predictions published before each race and graded after." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts without blocking render: preload the stylesheet, then swap it in
         on load (font-display:swap in the URL avoids invisible text). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <!-- Critical inline CSS so the paper theme and the above-the-fold dark hero
         band paint immediately, before the JS bundle downloads (fast FCP/LCP on mobile). -->
    <style>
      html,body{margin:0;background:#f7f5f2;color:#1a1a1a;
        font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;}
      .pre-hero{background:#141414;padding:56px 24px 44px;}
      .pre-hero-inner{max-width:1180px;margin:0 auto;}
      .pre-eyebrow{font-weight:700;font-size:.72rem;
        letter-spacing:.14em;text-transform:uppercase;color:#d62828;}
      .pre-title{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:800;
        font-size:clamp(2.2rem,1.4rem + 4vw,4rem);line-height:.94;text-transform:uppercase;
        margin:8px 0 0;color:#f7f5f2;}
      .pre-sub{color:rgba(247,245,242,.78);max-width:560px;margin-top:12px;font-size:1rem;
        border-bottom:2px solid #c9a227;display:inline-block;padding-bottom:8px;}
    </style>
  </head>
  <body>
    <!-- Static above-the-fold shell: React replaces #root on mount. This gives an
         instant first paint; the real interactive app hydrates right after. -->
    <div id="root">
      <div class="pre-hero">
        <div class="pre-hero-inner">
          <div class="pre-eyebrow">F1GRID / LIVE PREDICTION ENGINE</div>
          <h1 class="pre-title">Race weekend,<br />predicted.</h1>
          <p class="pre-sub">A leakage-free, walk-forward Formula 1 forecast. Every
            prediction is published before the race and graded against the real result
            afterward.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
