<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1Grid — Race Intelligence</title>
    <meta name="description" content="Explore Formula 1 race forecasts with the 2026 driver grid, team colorways, and tyre strategy scenarios." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts without blocking render: preload the stylesheet, then swap it in
         on load (font-display:swap in the URL avoids invisible text). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <!-- Critical inline CSS so the paper theme and the above-the-fold dark hero
         band paint immediately, before the JS bundle downloads (fast FCP/LCP on mobile). -->
    <style>
      html,body{margin:0;background:#f0f2f4;color:#171d25;
        font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;}
      .pre-hero{background:#0b1017;padding:48px 24px 44px;color:#f6f7f8;}
      .pre-hero-inner{max-width:1380px;margin:0 auto;}
      .pre-eyebrow{font-weight:700;font-size:.72rem;
        letter-spacing:.14em;text-transform:uppercase;color:#e21b34;}
      .pre-title{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:800;
        font-size:clamp(2.2rem,1.4rem + 4vw,4rem);line-height:.94;text-transform:uppercase;
        margin:8px 0 0;color:#f6f7f8;}
      .pre-sub{color:rgba(240,244,248,.74);max-width:560px;margin-top:12px;font-size:1rem;}
    </style>
  </head>
  <body>
    <!-- Static above-the-fold shell: React replaces #root on mount. This gives an
         instant first paint; the real interactive app hydrates right after. -->
    <div id="root">
      <div class="pre-hero">
        <div class="pre-hero-inner">
          <div class="pre-eyebrow">F1GRID / RACE INTELLIGENCE</div>
          <h1 class="pre-title">Race weekend,<br />predicted.</h1>
          <p class="pre-sub">A data-first Formula 1 forecast. Every pick is published before lights out, then graded against the result.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
