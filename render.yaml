# Render blueprint for the F1Grid API (inference-only, reads committed artifacts).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render builds the
# Dockerfile, runs it in deployed mode, and auto-redeploys on every push to main.
services:
  - type: web
    name: f1grid-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /
    envVars:
      # Deployed mode: publish and score are refused (HTTP 403); read-only endpoints
      # work. The container also defaults F1GRID_DEPLOYED=1, this makes it explicit.
      - key: F1GRID_DEPLOYED
        value: "1"
      # Exact browser origins allowed by CORS (never a wildcard): localhost for dev.
      - key: F1GRID_CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      # Regex allowing this Vercel project's production + preview domains with one
      # rule (unrelated origins are still rejected). Matches f1grid01.vercel.app and
      # f1grid01-<preview>.vercel.app, not evil.vercel.app or f1grid01.evil.com.
      - key: F1GRID_CORS_ORIGIN_REGEX
        value: '^https://f1grid01(-[a-z0-9-]+)?\.vercel\.app$'
    # Render injects $PORT and the Dockerfile CMD binds to it (uvicorn --port $PORT).
